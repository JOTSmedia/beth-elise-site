<!doctype html>
<meta charset="utf-8"><title>shot harness</title>
<!--
  Screenshot harness for build-time visual checks. Not part of the site.

  Headless Chrome only ever captures the top of a page, and it clamps a
  headless window to a 500px minimum width — so a plain `--window-size=360`
  screenshot is a crop of a 500px layout, not a mobile render. This loads the
  real page in a sized iframe instead and drives it.

    ?src=<page>      page to load            (default ../index.html)
    ?sel=<selector>  scroll that into view
    ?pad=<px>        gap above it            (default 60)
    ?y=<px>          absolute scroll instead
    ?click=<a,b>     click these before scrolling

  Reveal-on-scroll is forced on before capture: the sections stage themselves
  via IntersectionObserver, which a jump-scroll can outrun, and the point of
  the shot is the finished state.
-->
<style>html,body{margin:0;overflow:hidden;background:#160E2A}iframe{border:0;display:block}</style>
<iframe id="f" src="../index.html" width="1280" height="900"></iframe>
<script>
  var q = new URLSearchParams(location.search);
  var f = document.getElementById('f');
  if (q.get('src')) f.src = q.get('src');
  f.addEventListener('load', function () {
    setTimeout(function () {
      var w = f.contentWindow, d = f.contentDocument;
      d.documentElement.style.scrollBehavior = 'auto';

      (q.get('click') || '').split(',').filter(Boolean).forEach(function (sel) {
        var el = d.querySelector(sel.trim());
        if (el) el.click();
      });

      d.querySelectorAll('.fade-in').forEach(function (el) {
        el.classList.add('visible');
      });

      if (q.get('sel')) {
        var el = d.querySelector(q.get('sel'));
        if (el) for (var i = 0; i < 10; i++)
          w.scrollBy(0, el.getBoundingClientRect().top - (+q.get('pad') || 60));
      } else if (q.get('y')) {
        w.scrollTo(0, +q.get('y'));
      }
    }, 3000);
  });
</script>
