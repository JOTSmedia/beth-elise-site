<!DOCTYPE html>
<html>
<head>
  <style>
    body { background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .assistant-avatar-btn {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      overflow: hidden;
      background: radial-gradient(circle at 35% 35%, rgba(65, 20, 140, 0.95) 0%, rgba(14, 2, 32, 0.98) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>
  <div class="assistant-avatar-btn">
    <canvas id="assistant-avatar-canvas" width="76" height="76"></canvas>
  </div>
  <script>
    const canvas = document.getElementById('assistant-avatar-canvas');
    const ctx = canvas.getContext('2d');
    
    const imgPhotorealisticIris = new Image();
    imgPhotorealisticIris.src = 'images/photorealistic_purple_iris_orb.webp';

    function drawOrganicEye(ctx, cx, cy, r, gazeX, gazeY, blinkPhase, pupilRadius, colors, now, isLocked = false) {
      ctx.save();
      ctx.translate(cx, cy);

      const aw = r * 1.58;
      const ah = r * 0.96;

      ctx.save();
      ctx.beginPath();
      ctx.moveTo(-aw * 0.50, 0);
      ctx.bezierCurveTo(-aw * 0.32, -ah * 0.60, aw * 0.16, -ah * 0.54, aw * 0.50, -ah * 0.04);
      ctx.bezierCurveTo(aw * 0.22, ah * 0.52, -aw * 0.30, ah * 0.44, -aw * 0.50, 0);
      ctx.closePath();
      ctx.clip();

      const scleraGrad = ctx.createRadialGradient(-r * 0.15, -r * 0.15, 2, 0, 0, r);
      scleraGrad.addColorStop(0, '#FFFFFF');
      scleraGrad.addColorStop(1, '#C8ACEC');
      ctx.fillStyle = scleraGrad;
      ctx.fillRect(-aw * 0.65, -ah * 0.65, aw * 1.3, ah * 1.3);
      
      const irisR = r * 0.49;
      ctx.save();
      ctx.fillStyle = 'purple';
      ctx.beginPath();
      ctx.arc(0, 0, irisR, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      ctx.restore();
      ctx.restore();
    }

    function render(now) {
      const aw = canvas.width;
      const ah = canvas.height;
      ctx.clearRect(0, 0, aw, ah);
      drawOrganicEye(ctx, aw * 0.5, ah * 0.5, aw * 0.45, 0, 0, 0, 8.5, [], now);
      requestAnimationFrame(render);
    }
    requestAnimationFrame(render);
  </script>
</body>
</html>
